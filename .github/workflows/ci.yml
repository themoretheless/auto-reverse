name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: themoretheless/.github/.github/actions/setup-rust@bb3377f2f424201379ab4e47e147f164f4014b38 # v1
        with:
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Check GUI build
        run: cargo check
      - name: Check lean build
        run: cargo check --no-default-features
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build and inspect app bundle
        run: scripts/build-app-bundle.sh
      - name: Check signing and notarization workflow
        run: scripts/check-release-workflow.sh
      - name: Check install, update, and uninstall workflow
        run: scripts/check-install-workflow.sh
